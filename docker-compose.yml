version: '3.8'

services:
  # MongoDB 数据库
  mongodb:
    image: mongo:6.0
    container_name: work-diary-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: workdiary
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - work-diary-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: work-diary-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/workdiary?authSource=admin
      - JWT_SECRET=your-production-secret-key-change-this
      - USE_LOCAL_LLM=false
      - LOCAL_LLM_API_URL=http://localhost:11434/api/generate
      - LOCAL_LLM_MODEL=llama3
      - LOCAL_LLM_TIMEOUT=60000
      - LOCAL_LLM_TEMPERATURE=0.7
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - work-diary-network
    volumes:
      - ./backend/uploads:/app/uploads

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: work-diary-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - work-diary-network

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: work-diary-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - work-diary-network

volumes:
  mongodb_data:

networks:
  work-diary-network:
    driver: bridge