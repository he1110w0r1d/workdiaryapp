version: '3.8'

services:
  # MongoDB 数据库
  mongodb:
    image: mongo:8.0
    container_name: work-diary-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword123
      MONGO_INITDB_DATABASE: workdiary
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - work-diary-network
    
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: work-diary-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:adminpassword123@mongodb:27017/workdiary?authSource=admin
      - JWT_SECRET=your-super-secure-jwt-secret-key-change-in-production
      - SESSION_SECRET=your-super-secure-session-secret-change-in-production
      - ENCRYPTION_KEY=your-encryption-key-32-chars-change-me!!
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backup:/app/backup
    depends_on:
      - mongodb
    networks:
      - work-diary-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: work-diary-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - work-diary-network

volumes:
  mongodb_data:

networks:
  work-diary-network:
    driver: bridge